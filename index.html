<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play Drawing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Play Drawing</h1>
  </header>

  <div class="toolbar">
    <button id="addOffense">Add player</button>
    <button id="addDefense">Add defense</button>
    <button id="addBall">Add ball</button>
    <button id="clearCourt" class="secondary">Clear</button>
  </div>

  <main class="court-wrap">
    <canvas id="courtCanvas" aria-label="Basketball half-court"></canvas>
  </main>
  <p class="hint">Drag a token to move it. Double-click a token to remove it.</p>

  <script src="js/court.js"></script>
  <script src="js/tokens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
