<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play Drawing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Play Drawing</h1>
  </header>

  <div class="tray" id="tray">
    <div class="tray-chip" data-type="offense" tabindex="0" aria-label="Drag onto the court to add an offense player">
      <span class="tray-chip-icon tray-chip-offense">+</span>
      <span class="tray-chip-count"></span>
    </div>
    <div class="tray-chip" data-type="defense" tabindex="0" aria-label="Drag onto the court to add a defender">
      <span class="tray-chip-icon tray-chip-defense">×</span>
      <span class="tray-chip-count"></span>
    </div>
    <div class="tray-chip" data-type="ball" tabindex="0" aria-label="Drag onto the court to add the ball">
      <span class="tray-chip-icon tray-chip-ball"></span>
      <span class="tray-chip-count"></span>
    </div>
    <button id="clearCourt" class="secondary">Clear</button>
  </div>

  <main class="court-wrap">
    <canvas id="courtCanvas" aria-label="Basketball half-court"></canvas>
  </main>
  <p class="hint">Drag a token from the tray onto the court to place it. Drag a token off the court (or double-click it) to remove it.</p>

  <script src="js/court.js"></script>
  <script src="js/tokens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
